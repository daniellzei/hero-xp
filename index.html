<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Hero XP</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b0d10;
  --card: #171b22;
  --line: #303744;
  --text: #f3f4f6;
  --muted: #acb5c4;
  --green: #39e58c;
  --red: #ff6574;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
  font-size: 16px;
}
button, input, select, textarea { font: inherit; }
button {
  min-height: 46px;
  padding: 11px 16px;
  border: 1px solid var(--line);
  border-radius: 13px;
  color: var(--text);
  background: #242b35;
  cursor: pointer;
}
button:active { transform: scale(.98); }
button:disabled { opacity: .45; cursor: default; }
button.primary {
  background: var(--green);
  color: #062818;
  font-weight: 800;
  border: 0;
}
button.danger { color: var(--red); }
button.wide { width: 100%; }
input, select, textarea {
  width: 100%;
  min-height: 48px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #0f1319;
  color: var(--text);
}
textarea { resize: vertical; min-height: 94px; }
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}
label { display: block; margin: 15px 0 7px; font-weight: 650; }
h1, h2, h3, p { overflow-wrap: anywhere; }
h1 { font-size: 30px; margin: 10px 0; }
h2 { font-size: 22px; margin: 0 0 15px; }
h3 { font-size: 17px; margin: 0 0 7px; }
p { line-height: 1.5; }
small, .muted { color: var(--muted); }
small { line-height: 1.5; }
header {
  max-width: 620px;
  margin: auto;
  padding: 22px 20px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand { font-weight: 950; letter-spacing: 2px; }
.brand span { color: var(--red); }
.tag {
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--green);
  border: 1px solid #24583d;
  padding: 6px 9px;
  border-radius: 20px;
}
main { max-width: 620px; margin: auto; padding: 22px 18px 110px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
}
.hero {
  text-align: center;
  background:
    radial-gradient(ellipse at top, #46222c 0, transparent 65%),
    var(--card);
}
.eyebrow {
  color: var(--red);
  text-transform: uppercase;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
}
.avatar {
  width: 108px;
  height: 108px;
  margin: 20px auto 14px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 3px solid var(--red);
  background: #131820;
  box-shadow: 0 0 28px #ff657422;
  overflow: hidden;
  font-size: 48px;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.level { font-size: 13px; letter-spacing: 3px; color: var(--green); }
.rank { font-size: 25px; margin: 7px 0 20px; font-weight: 850; }
progress {
  appearance: none;
  width: 100%;
  height: 16px;
  border: 0;
  border-radius: 20px;
  overflow: hidden;
  background: #080c11;
}
progress::-webkit-progress-bar { background: #080c11; }
progress::-webkit-progress-value {
  background: linear-gradient(90deg, #159e59, var(--green));
  border-radius: 20px;
  transition: width .6s ease;
}
progress::-moz-progress-bar { background: var(--green); }
.xp { color: var(--green); font-weight: 850; white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.row > input { min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.stats { display: flex; gap: 12px; margin-top: 16px; }
.stats > div {
  flex: 1;
  border-radius: 14px;
  padding: 13px 8px;
  background: #0d1219;
}
.stats strong { display: block; font-size: 23px; }
.task { border-left: 3px solid var(--green); }
.task-title { white-space: pre-wrap; }
.chip {
  display: inline-block;
  padding: 5px 9px;
  margin: 4px 0;
  font-size: 12px;
  background: #242c37;
  border-radius: 8px;
}
.actions { display: flex; gap: 8px; margin-top: 12px; }
.actions button { font-size: 13px; }
nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 5px;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: #11161df5;
  border-top: 1px solid var(--line);
  z-index: 10;
}
nav button {
  flex: 1;
  max-width: 195px;
  border: 0;
  background: transparent;
  font-size: 13px;
  color: var(--muted);
}
nav button.active { color: var(--green); background: #183327; }
dialog {
  width: min(92%, 480px);
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--card);
  color: var(--text);
}
dialog::backdrop { background: #000c; }
dialog .actions { justify-content: flex-end; }
.celebration { text-align: center; }
.celebration .symbol {
  font-size: 66px;
  animation: arrive .6s ease;
}
@keyframes arrive {
  from { transform: scale(.5) rotate(-15deg); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
#toast {
  position: fixed;
  bottom: 95px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--green);
  color: #062818;
  padding: 13px 20px;
  border-radius: 30px;
  font-weight: 800;
  max-width: 90%;
  text-align: center;
  z-index: 50;
}
.empty { text-align: center; padding: 25px 10px; color: var(--muted); }
.no-motion *, .no-motion *::before, .no-motion *::after {
  animation: none !important;
  transition: none !important;
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header>
  <div class="brand">HERO<span>XP</span></div>
  <div class="tag">SUA JORNADA</div>
</header>

<main id="app"></main>

<nav aria-label="Navegação principal">
  <button id="nav-home" onclick="go('home')">⚡ Início</button>
  <button id="nav-history" onclick="go('history')">☑ Histórico</button>
  <button id="nav-settings" onclick="go('settings')">⚙ Ajustes</button>
</nav>

<dialog id="modal"></dialog>
<div id="toast" role="status" hidden></div>

<script>
'use strict';

const KEY = 'hero-xp-v1';
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;',
  '"': '&quot;', "'": '&#39;'
}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const clone = value => JSON.parse(JSON.stringify(value));
const fmt = n => Number(n).toLocaleString('pt-BR');

function initialState() {
  return {
    version: 1,
    hero: 'Meu Herói',
    photo: '',
    motion: true,
    categories: [
      { id: 'study', name: 'Estudos', xp: 20, archived: false },
      { id: 'training', name: 'Treino', xp: 30, archived: false },
      { id: 'routine', name: 'Rotina', xp: 10, archived: false }
    ],
    levels: [
      { name: 'Recruta', cost: 100, message: 'Sua jornada começa agora!' },
      { name: 'Vigilante', cost: 200, message: 'Pequenas ações. Grandes poderes.' },
      { name: 'Guardião', cost: 300, message: 'Sua constância está fazendo história.' },
      { name: 'Sentinela', cost: 500, message: 'Você está superando seus próprios limites!' },
      { name: 'Lenda', cost: 1000, message: 'Uma missão de cada vez. Uma lenda para sempre.' }
    ],
    tasks: []
  };
}

function validState(x) {
  const text = (v, max) => typeof v === 'string' && v.length <= max;
  const integer = (v, min, max) => Number.isSafeInteger(v) && v >= min && v <= max;
  if (!x || x.version !== 1 || !text(x.hero, 60) || !x.hero.trim()) return false;
  if (!text(x.photo, 500000) || !/^$|^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(x.photo)) return false;
  if (typeof x.motion !== 'boolean') return false;
  if (!Array.isArray(x.categories) || x.categories.length > 500) return false;
  if (!x.categories.every(c => c && text(c.id, 100) && c.id &&
      text(c.name, 50) && c.name.trim() &&
      integer(c.xp, 1, 1000000) && typeof c.archived === 'boolean')) return false;
  const ids = new Set(x.categories.map(c => c.id));
  if (ids.size !== x.categories.length) return false;
  if (!Array.isArray(x.levels) || x.levels.length < 1 || x.levels.length > 100) return false;
  if (!x.levels.every(l => l && text(l.name, 60) && l.name.trim() &&
      text(l.message, 500) && integer(l.cost, 1, 1000000))) return false;
  if (!Array.isArray(x.tasks) || x.tasks.length > 20000) return false;
  if (!x.tasks.every(t => t && text(t.text, 300) && t.text.trim() &&
      ids.has(t.categoryId) && integer(t.xp, 1, 1000000) &&
      integer(t.at, 0, 8640000000000000))) return false;
  return true;
}

let state;
try {
  const raw = localStorage.getItem(KEY);
  state = raw ? JSON.parse(raw) : initialState();
  if (!validState(state)) throw new Error('Dados inválidos');
} catch (error) {
  document.body.innerHTML =
    '<main><h1>Não foi possível abrir os dados.</h1>' +
    '<p>Não limpe os dados nem desinstale o aplicativo. ' +
    'Feche e abra novamente; se persistir, solicite ajuda para recuperar o armazenamento.</p></main>';
  throw error;
}

let page = 'home';
let filter = '';
let toastTimer;
let celebrations = [];

function totalXP() {
  return state.tasks.reduce((sum, task) => sum + task.xp, 0);
}

function progress() {
  let remaining = totalXP();
  let index = 0;
  while (index < state.levels.length - 1 &&
         remaining >= state.levels[index].cost) {
    remaining -= state.levels[index].cost;
    index++;
  }
  return {
    index,
    current: remaining,
    cost: state.levels[index].cost,
    max: index === state.levels.length - 1
  };
}

function commit(change) {
  const next = clone(state);
  change(next);
  if (!validState(next)) {
    alert('Confira os valores. Há um campo inválido ou um limite excedido.');
    return false;
  }
  try {
    localStorage.setItem(KEY, JSON.stringify(next));
  } catch {
    alert('Não foi possível salvar. O armazenamento pode estar cheio. Faça um backup.');
    return false;
  }
  state = next;
  render();
  return true;
}

function notify(message) {
  clearTimeout(toastTimer);
  $('toast').textContent = message;
  $('toast').hidden = false;
  toastTimer = setTimeout(() => $('toast').hidden = true, 2600);
}

function go(next) {
  page = next;
  render();
  window.scrollTo(0, 0);
}

function categoryOptions(selected = '') {
  return state.categories
    .filter(c => !c.archived || c.id === selected)
    .map(c => `<option value="${esc(c.id)}" ${c.id === selected ? 'selected' : ''}>
      ${esc(c.name)} · ${fmt(c.xp)} XP${c.archived ? ' (arquivada)' : ''}
    </option>`).join('');
}

function render() {
  document.body.classList.toggle('no-motion', !state.motion);
  ['home', 'history', 'settings'].forEach(name => {
    $('nav-' + name).classList.toggle('active', name === page);
    $('nav-' + name).setAttribute('aria-current', name === page ? 'page' : 'false');
  });
  $('app').innerHTML =
    page === 'home' ? homeHTML() :
    page === 'history' ? historyHTML() : settingsHTML();
}

function homeHTML() {
  const p = progress();
  const today = new Date().toDateString();
  const doneToday = state.tasks.filter(t => new Date(t.at).toDateString() === today);
  const activeCategories = state.categories.some(c => !c.archived);
  return `
    <section class="card hero">
      <div class="eyebrow">Identidade do herói</div>
      <h1>${esc(state.hero)}</h1>
      <div class="avatar">
        ${state.photo ? `<img src="${state.photo}" alt="Foto do herói">` : '⚡'}
      </div>
      <div class="level">NÍVEL ${p.index}</div>
      <div class="rank">${esc(state.levels[p.index].name)}</div>
      <progress id="xpbar" max="${p.max ? 1 : p.cost}"
        value="${p.max ? 1 : p.current}" aria-label="Progresso do nível"></progress>
      <p class="xp">${p.max ? 'NÍVEL MÁXIMO' : `${fmt(p.current)} / ${fmt(p.cost)} XP`}</p>
      <small>${p.max ? 'Sua jornada continua acumulando experiência.' :
        `Faltam ${fmt(p.cost - p.current)} XP para evoluir.`}</small>
      <div class="stats">
        <div><strong>${fmt(doneToday.length)}</strong><small>missões hoje</small></div>
        <div><strong>${fmt(totalXP())}</strong><small>XP total</small></div>
      </div>
    </section>
    <section class="card">
      <h2>Missão cumprida</h2>
      <form onsubmit="addTask(event)">
        <label for="taskCategory">Categoria e recompensa</label>
        <select id="taskCategory" required>${categoryOptions()}</select>
        <label for="taskText">O que você fez?</label>
        <div class="row">
          <input id="taskText" maxlength="300" required
            placeholder="Ex.: li um capítulo" autocomplete="off">
          <button class="primary" type="submit" aria-label="Concluir e adicionar tarefa"
            ${activeCategories ? '' : 'disabled'}>＋</button>
        </div>
        <p><small>Ao adicionar, a missão é concluída e o XP entra na sua evolução.</small></p>
        ${activeCategories ? '' : '<p class="muted">Crie ou reative uma categoria em Ajustes.</p>'}
      </form>
    </section>`;
}

function addTask(event) {
  event.preventDefault();
  const text = $('taskText').value.trim();
  const category = state.categories.find(c => c.id === $('taskCategory').value && !c.archived);
  if (!text || !category) return;
  const before = progress();
  const ok = commit(s => s.tasks.push({
    text, categoryId: category.id, xp: category.xp, at: Date.now()
  }));
  if (!ok) return;
  const after = progress();
  if (after.index === before.index && !after.max) {
    const bar = $('xpbar');
    bar.value = before.current;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (bar.isConnected) bar.value = after.current;
    }));
  }
  notify(`+${fmt(category.xp)} XP · Missão cumprida!`);
  celebrateBetween(before.index, after.index);
}

function historyHTML() {
  const tasks = state.tasks.map((t, index) => ({ ...t, index }))
    .reverse().filter(t => !filter || t.categoryId === filter);
  return `
    <h1>Missões cumpridas</h1>
    <p class="muted">${fmt(state.tasks.length)} registros · ${fmt(totalXP())} XP acumulados</p>
    <label for="historyFilter">Filtrar categoria</label>
    <select id="historyFilter" onchange="filter=this.value;render()">
      <option value="">Todas as categorias</option>
      ${state.categories.map(c => `<option value="${esc(c.id)}"
        ${filter === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
    </select>
    <div style="height:16px"></div>
    ${tasks.length ? tasks.map(t => {
      const c = state.categories.find(c => c.id === t.categoryId);
      return `<article class="card task">
        <div class="row between">
          <h3 class="task-title">${esc(t.text)}</h3>
          <span class="xp">+${fmt(t.xp)} XP</span>
        </div>
        <span class="chip">${esc(c.name)}</span><br>
        <small>${new Date(t.at).toLocaleString('pt-BR')}</small>
        <div class="actions">
          <button onclick="editTask(${t.index})">Editar</button>
          <button class="danger" onclick="deleteTask(${t.index})">Excluir</button>
        </div>
      </article>`;
    }).join('') : '<div class="empty">Nenhuma missão por aqui ainda.</div>'}`;
}

function showModal(html) {
  const modal = $('modal');
  if (modal.open) modal.close();
  modal.innerHTML = html;
  modal.showModal();
}
function closeModal() { $('modal').close(); }

function editTask(index) {
  const task = state.tasks[index];
  showModal(`
    <h2>Editar missão</h2>
    <form onsubmit="saveTask(event, ${index})">
      <label for="editText">Descrição</label>
      <textarea id="editText" maxlength="300" required>${esc(task.text)}</textarea>
      <label for="editCategory">Categoria</label>
      <select id="editCategory">${categoryOptions(task.categoryId)}</select>
      <p><small>Trocar a categoria substitui o XP pelo valor atual da nova categoria.
      Alterar somente o texto preserva o XP original.</small></p>
      <div class="actions">
        <button type="button" onclick="closeModal()">Cancelar</button>
        <button class="primary">Salvar</button>
      </div>
    </form>`);
}

function saveTask(event, index) {
  event.preventDefault();
  const text = $('editText').value.trim();
  const categoryId = $('editCategory').value;
  if (!text) return;
  const oldTask = state.tasks[index];
  const category = state.categories.find(c => c.id === categoryId);
  const xp = categoryId === oldTask.categoryId ? oldTask.xp : category.xp;
  if (xp !== oldTask.xp &&
      !confirm(`O XP desta missão mudará de ${oldTask.xp} para ${xp}. Confirmar?`)) return;
  const before = progress().index;
  if (commit(s => Object.assign(s.tasks[index], { text, categoryId, xp }))) {
    closeModal();
    notify('Missão atualizada.');
    celebrateBetween(before, progress().index);
  }
}

function deleteTask(index) {
  const task = state.tasks[index];
  if (!confirm(`Excluir esta missão e remover ${task.xp} XP? Seu nível será recalculado.`)) return;
  if (commit(s => s.tasks.splice(index, 1))) notify('Missão excluída. XP recalculado.');
}

function settingsHTML() {
  return `
    <h1>Central do herói</h1>
    <section class="card">
      <h2>Identidade</h2>
      <form onsubmit="saveHero(event)">
        <label for="heroName">Nome do herói</label>
        <input id="heroName" maxlength="60" value="${esc(state.hero)}" required>
        <label for="heroPhoto">Foto do celular</label>
        <input id="heroPhoto" type="file" accept="image/*" onchange="setPhoto(this)">
        <p><small>A foto é salva quando você a seleciona.</small></p>
        <div class="actions">
          <button class="primary">Salvar nome</button>
          <button type="button" onclick="removePhoto()">Remover foto</button>
        </div>
      </form>
      <label for="motion">Animações</label>
      <select id="motion" onchange="commit(s => s.motion=this.value==='yes')">
        <option value="yes" ${state.motion ? 'selected' : ''}>Ativadas</option>
        <option value="no" ${!state.motion ? 'selected' : ''}>Desativadas</option>
      </select>
    </section>

    <section class="card">
      <h2>Categorias e XP</h2>
      <p><small>O XP é o peso da categoria. Alterações valem para novas missões;
      missões antigas preservam sua recompensa.</small></p>
      ${state.categories.map((c, i) => `
        <div style="border-top:1px solid var(--line);padding:14px 0">
          <div class="row between">
            <strong>${esc(c.name)}${c.archived ? ' · arquivada' : ''}</strong>
            <span class="xp">${fmt(c.xp)} XP</span>
          </div>
          <div class="actions">
            <button onclick="editCategory(${i})">Editar</button>
            <button onclick="toggleCategory(${i})">${c.archived ? 'Reativar' : 'Arquivar'}</button>
          </div>
        </div>`).join('')}
      <button class="primary wide" onclick="editCategory(-1)">＋ Nova categoria</button>
    </section>

    <section class="card">
      <h2>Níveis e mensagens</h2>
      <p><small>O requisito indica o XP necessário para sair daquele nível.
      O primeiro nível é o nível 0. Mudar estes valores recalcula sua posição.</small></p>
      ${state.levels.map((l, i) => `
        <div style="border-top:1px solid var(--line);padding:14px 0">
          <strong>Nível ${i} · ${esc(l.name)}</strong>
          <p class="muted">${i === state.levels.length - 1 ? 'Nível máximo' :
            `${fmt(l.cost)} XP até o próximo nível`}</p>
          <button onclick="editLevel(${i})">Nome, XP e mensagem</button>
        </div>`).join('')}
      <div class="row wrap">
        <button class="primary" onclick="addLevel()">＋ Adicionar nível</button>
        <button class="danger" onclick="removeLevel()" ${state.levels.length < 2 ? 'disabled' : ''}>
          Remover último
        </button>
      </div>
    </section>

    <section class="card">
      <h2>Backup</h2>
      <p><small>Seus dados ficam neste dispositivo, sem sincronização.
      Guarde uma cópia antes de desinstalar ou trocar de aparelho.</small></p>
      <div class="row wrap">
        <button onclick="exportBackup()">Gerar backup</button>
        <button onclick="importBackup()">Restaurar backup</button>
      </div>
    </section>`;
}

function saveHero(event) {
  event.preventDefault();
  const name = $('heroName').value.trim();
  if (name && commit(s => s.hero = name)) notify('Identidade atualizada.');
}

async function setPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/') || file.size > 20 * 1024 * 1024) {
    alert('Escolha uma imagem com até 20 MB.');
    return;
  }
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 320;
      const ctx = canvas.getContext('2d');
      const side = Math.min(img.width, img.height);
      ctx.fillStyle = '#171b22';
      ctx.fillRect(0, 0, 320, 320);
      ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2,
                    side, side, 0, 0, 320, 320);
      const photo = canvas.toDataURL('image/jpeg', .8);
      if (commit(s => s.photo = photo)) notify('Foto atualizada.');
    } catch {
      alert('Não foi possível processar esta imagem.');
    } finally {
      URL.revokeObjectURL(url);
    }
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    alert('Não foi possível abrir a imagem. Tente uma foto JPG ou PNG.');
  };
  img.src = url;
}

function removePhoto() {
  if (commit(s => s.photo = '')) notify('Foto removida.');
}

function editCategory(index) {
  const c = index < 0 ? { name: '', xp: 10 } : state.categories[index];
  showModal(`
    <h2>${index < 0 ? 'Nova categoria' : 'Editar categoria'}</h2>
    <form onsubmit="saveCategory(event, ${index})">
      <label for="categoryName">Nome</label>
      <input id="categoryName" maxlength="50" value="${esc(c.name)}" required>
      <label for="categoryXP">XP por missão concluída</label>
      <input id="categoryXP" type="number" min="1" max="1000000" step="1"
        value="${c.xp}" required>
      <div class="actions">
        <button type="button" onclick="closeModal()">Cancelar</button>
        <button class="primary">Salvar</button>
      </div>
    </form>`);
}

function saveCategory(event, index) {
  event.preventDefault();
  const name = $('categoryName').value.trim();
  const xp = Number($('categoryXP').value);
  if (!name) return;
  const ok = commit(s => {
    if (index < 0) s.categories.push({ id: uid(), name, xp, archived: false });
    else Object.assign(s.categories[index], { name, xp });
  });
  if (ok) { closeModal(); notify('Categoria salva.'); }
}

function toggleCategory(index) {
  commit(s => s.categories[index].archived = !s.categories[index].archived);
}

function editLevel(index) {
  const l = state.levels[index];
  showModal(`
    <h2>Personalizar nível ${index}</h2>
    <form onsubmit="saveLevel(event, ${index})">
      <label for="levelName">Nome do nível</label>
      <input id="levelName" maxlength="60" value="${esc(l.name)}" required>
      <label for="levelCost">XP para chegar ao próximo nível</label>
      <input id="levelCost" type="number" min="1" max="1000000" step="1"
        value="${l.cost}" required>
      ${index === state.levels.length - 1 ?
        '<p><small>No nível máximo, este valor só será usado se você adicionar outro nível.</small></p>' : ''}
      <label for="levelMessage">Mensagem ao alcançar este nível</label>
      <textarea id="levelMessage" maxlength="500">${esc(l.message)}</textarea>
      <div class="actions">
        <button type="button" onclick="closeModal()">Cancelar</button>
        <button class="primary">Salvar</button>
      </div>
    </form>`);
}

function saveLevel(event, index) {
  event.preventDefault();
  const name = $('levelName').value.trim();
  const cost = Number($('levelCost').value);
  const message = $('levelMessage').value.trim();
  if (!name) return;
  if (cost !== state.levels[index].cost &&
      !confirm('Alterar este requisito pode mudar seu nível atual. Continuar?')) return;
  if (commit(s => s.levels[index] = { name, cost, message })) {
    closeModal();
    notify('Nível personalizado.');
  }
}

function addLevel() {
  if (state.levels.length >= 100) {
    alert('Esta versão permite até 100 níveis.');
    return;
  }
  if (!confirm('Adicionar um novo nível máximo? Sua posição será recalculada.')) return;
  if (commit(s => s.levels.push({
    name: 'Novo título',
    cost: 1000,
    message: 'Você alcançou um novo patamar!'
  }))) editLevel(state.levels.length - 1);
}

function removeLevel() {
  if (state.levels.length < 2) return;
  if (confirm('Remover o último nível? Sua posição será recalculada.')) {
    commit(s => s.levels.pop());
  }
}

function celebrateBetween(before, after) {
  celebrations = [];
  for (let i = before + 1; i <= after; i++) celebrations.push(i);
  nextCelebration();
}

function nextCelebration() {
  if (!celebrations.length) return;
  const index = celebrations.shift();
  const level = state.levels[index];
  showModal(`
    <div class="celebration">
      <div class="symbol">🏆</div>
      <div class="eyebrow">Novo nível desbloqueado</div>
      <h1>Nível ${index}</h1>
      <h2>${esc(level.name)}</h2>
      <p style="white-space:pre-wrap">${esc(level.message)}</p>
      <button class="primary wide" onclick="closeModal();nextCelebration()">
        ${celebrations.length ? 'Próxima conquista' : 'Continuar jornada'}
      </button>
    </div>`);
}

$('modal').addEventListener('cancel', () => { celebrations = []; });

function exportBackup() {
  showModal(`
    <h2>Seu backup</h2>
    <p>Selecione e copie todo o texto abaixo. Guarde em um arquivo ou nota privada.
    Ele inclui suas tarefas, configurações e foto.</p>
    <textarea id="backupText" readonly style="min-height:180px"></textarea>
    <div class="actions">
      <button onclick="$('backupText').focus();$('backupText').select()">Selecionar tudo</button>
      <button class="primary" onclick="closeModal()">Fechar</button>
    </div>`);
  $('backupText').value = JSON.stringify(state);
}

function importBackup() {
  showModal(`
    <h2>Restaurar backup</h2>
    <p>Cole o texto completo do backup. A restauração substituirá os dados atuais.</p>
    <textarea id="restoreText" placeholder="Cole seu backup aqui"></textarea>
    <div class="actions">
      <button onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="restoreBackup()">Restaurar</button>
    </div>`);
}

function restoreBackup() {
  try {
    const raw = $('restoreText').value;
    if (raw.length > 8000000) throw new Error();
    const restored = JSON.parse(raw);
    if (!validState(restored)) throw new Error();
    if (!confirm('Substituir todos os dados atuais por este backup?')) return;
    localStorage.setItem(KEY, JSON.stringify(restored));
    state = restored;
    filter = '';
    closeModal();
    render();
    notify('Backup restaurado.');
  } catch {
    alert('Backup inválido ou espaço insuficiente. Os dados atuais foram preservados.');
  }
}

render();
</script>
</body>
</html>
